services:
  homebridge:
    # Homebridge publishes dated tags only (no semver). 2026-06-24 == Homebridge 2.1.0.
    # Do NOT use :latest — it silently jumped 1.11.1 -> 2.x on 2026-07-04 and breaks plugins.
    image: homebridge/homebridge:2026-06-24
    container_name: homebridge
    restart: unless-stopped
    network_mode: host
    hostname: apple-pi
    volumes:
      # All state lives on the host; this stack holds no data of its own.
      - /opt/homebridge:/homebridge
    environment:
      - ENABLE_AVAHI=0
      - TZ=America/Los_Angeles
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
